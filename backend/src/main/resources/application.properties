# ==========================================================
# SMART HOSTEL ATTENDANCE MANAGEMENT SYSTEM
# Spring Boot Configuration
# ==========================================================

server.port=8080
spring.application.name=smart-hostel-attendance

# Default DataSource configuration (Uses H2 in-memory mode for instant plug-and-play testing)
# Switch to 'mysql' profile via '--spring.profiles.active=mysql' or set MySQL credentials below
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:smart_hostel_attendance;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at http://localhost:8080/h2-console during testing)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# College and Hostel Default Configuration
app.college.name=Adi Shankara Institute of Science and Technology
app.college.program=B.Tech Computer Science and Engineering
app.college.department=Computer Science and Engineering
app.hostel.default-name=Adi Shankara Institute Main Campus Hostel
app.hostel.default-latitude=10.1706000
app.hostel.default-longitude=76.4357000
app.hostel.default-radius=1000

# Logging
logging.level.com.smarthostel=DEBUG
logging.level.org.springframework.web=INFO
