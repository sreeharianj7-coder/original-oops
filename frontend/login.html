<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | HostelTrack</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-brand">
        <div class="brand-icon">🏛️</div>
        <div class="brand-info">
          <span class="brand-title">HostelTrack</span>
          <span class="brand-subtitle">Student Portal</span>
        </div>
      </a>
      <div class="nav-actions">
        <a href="admin-login.html" class="btn btn-sm btn-outline">Admin Login</a>
        <a href="register.html" class="btn btn-sm btn-secondary">Register</a>
      </div>
    </div>
  </nav>

  <!-- Login Container -->
  <main class="container container-narrow" style="padding-top: 3.5rem; padding-bottom: 4rem;">
    <div class="card" style="max-width: 480px; margin: 0 auto; padding: 2.25rem;">
      <div style="text-align: center; margin-bottom: 2rem;">
        <span class="badge badge-present" style="margin-bottom: 0.5rem;">Student Access</span>
        <h1 style="font-size: 1.85rem; margin-top: 0.25rem;">Welcome Back</h1>
        <p style="font-size: 0.9rem; margin-top: 0.25rem;">Login to your student attendance account</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-identifier">Student ID or Email</label>
          <input 
            type="text" 
            id="login-identifier" 
            class="form-control" 
            placeholder="e.g. ASIET2024CS001 or rahul.cs@adishankara.ac.in" 
            required 
            autocomplete="username"
          >
          <span class="form-hint">Use your college roll number or registered email.</span>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="form-label" for="login-password">Password</label>
            <a href="#" onclick="showToast('Please contact your hostel warden for password reset.', 'info'); return false;" style="font-size: 0.8rem;">Forgot Password?</a>
          </div>
          <input 
            type="password" 
            id="login-password" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block" style="margin-top: 1rem;">
          <span>🔐</span> Login to Student Dashboard
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-light); font-size: 0.88rem;">
        <p>Don't have an account? <a href="register.html" style="font-weight: 600;">Register Student Account</a></p>
        <div style="margin-top: 0.75rem;">
          <a href="admin-login.html" style="font-size: 0.82rem; color: var(--text-muted);">Hostel Administrator? Login here &rarr;</a>
        </div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Auth.redirectIfLoggedIn();

      const form = document.getElementById('login-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const identifier = document.getElementById('login-identifier').value.trim();
        const password = document.getElementById('login-password').value;
        const btn = document.getElementById('login-submit-btn');

        btn.disabled = true;
        btn.innerHTML = 'Authenticating...';

        try {
          const result = await Auth.loginStudent(identifier, password);
          if (result.success) {
            showToast('Login successful! Redirecting...', 'success');
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 600);
          } else {
            showToast(result.message || 'Invalid credentials', 'error');
            btn.disabled = false;
            btn.innerHTML = '<span>🔐</span> Login to Student Dashboard';
          }
        } catch (err) {
          showToast('An unexpected error occurred', 'error');
          btn.disabled = false;
          btn.innerHTML = '<span>🔐</span> Login to Student Dashboard';
        }
      });
    });
  </script>
</body>
</html>
